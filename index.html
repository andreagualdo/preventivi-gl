<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gruppo Leonardo — Preventivi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#B8873A;--gold-l:#D4A85A;--gold-p:#F5EDD8;--ch:#3A3A3A;--ch-m:#5A5A5A;--ch-lt:#8A8A8A;--sf:#FAFAF8;--bd:#E0D8CC;}
body{font-family:'Jost',sans-serif;color:var(--ch);background:var(--sf);min-height:100vh;}
.app{max-width:960px;margin:0 auto;padding-bottom:4rem;}
.topbar{background:var(--ch);display:flex;align-items:center;justify-content:space-between;padding:13px 28px;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:28px;width:auto;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;letter-spacing:.18em;color:#fff;text-transform:uppercase;}
.nav{display:flex;gap:4px;}
.nb{font-family:'Jost',sans-serif;font-size:11px;font-weight:400;letter-spacing:.08em;color:#AAA;background:none;border:none;cursor:pointer;padding:7px 16px;border-radius:3px;text-transform:uppercase;transition:all .15s;}
.nb.on{background:var(--gold);color:#fff;}
.nb:hover:not(.on){color:#fff;}
.gold-line{height:2px;background:var(--gold);}
.view{display:none;padding:28px 28px 0;}
.view.on{display:block;}
.sec-lbl{font-family:'Cormorant Garamond',serif;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.sec-lbl::after{content:'';flex:1;height:.5px;background:var(--bd);}
.card{background:#fff;border:.5px solid var(--bd);border-radius:6px;padding:20px 22px;margin-bottom:16px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.g2:last-child,.g3:last-child{margin-bottom:0;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ch-lt);}
.fld input,.fld select,.fld textarea{font-family:'Jost',sans-serif;font-size:12px;font-weight:300;color:var(--ch);background:var(--sf);border:.5px solid var(--bd);border-radius:4px;padding:8px 10px;outline:none;transition:border-color .15s;width:100%;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);background:#fff;}
.fld textarea{resize:vertical;min-height:80px;line-height:1.6;}
.macro{background:#fff;border:.5px solid var(--bd);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.mh{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:var(--ch);cursor:pointer;user-select:none;}
.mh-left{display:flex;align-items:center;gap:10px;}
.m-num{font-size:9px;font-weight:500;background:var(--gold);color:#fff;padding:2px 8px;border-radius:2px;letter-spacing:.05em;}
.m-name-inp{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:transparent;border:none;border-bottom:.5px solid rgba(255,255,255,.3);outline:none;width:220px;padding:1px 4px;}
.mh-right{display:flex;align-items:center;gap:14px;}
.m-tot{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:500;color:var(--gold-l);}
.m-del{font-size:11px;color:#888;cursor:pointer;padding:3px 8px;border-radius:3px;border:.5px solid rgba(255,255,255,.15);background:transparent;font-family:'Jost',sans-serif;letter-spacing:.05em;transition:all .15s;}
.m-del:hover{color:#fff;border-color:rgba(255,255,255,.4);}
.m-toggle{font-size:13px;color:#888;transition:transform .2s;}
.m-toggle.open{transform:rotate(180deg);}
.mb{display:none;}
.mb.open{display:block;}
.vt{width:100%;border-collapse:collapse;table-layout:fixed;}
.vt th{font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ch-lt);padding:8px 10px;text-align:left;border-bottom:.5px solid var(--bd);background:#F7F5F0;}
.vt td{padding:6px 10px;border-bottom:.5px solid #F0ECE4;font-size:11px;font-weight:300;color:var(--ch);vertical-align:middle;}
.vt tr:last-child td{border-bottom:none;}
.vt tr:hover td{background:#FDFBF7;}
.vt input,.vt select{font-family:'Jost',sans-serif;font-size:11px;font-weight:300;color:var(--ch);background:transparent;border:none;outline:none;width:100%;padding:1px 0;}
.vt input:focus{background:#FFFDF8;border-bottom:.5px solid var(--gold);}
.vt select{cursor:pointer;}
.tot-cell{color:var(--gold);font-weight:500;text-align:right;}
.del-voce{color:#CCC;cursor:pointer;font-size:12px;padding:2px 6px;border:none;background:none;transition:color .15s;}
.del-voce:hover{color:#c0392b;}
.add-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:.5px solid var(--bd);background:var(--sf);}
.add-row input{font-family:'Jost',sans-serif;font-size:11px;flex:1;border:.5px solid var(--bd);border-radius:3px;padding:6px 9px;background:#fff;outline:none;color:var(--ch);}
.add-row input:focus{border-color:var(--gold);}
.btn-add{font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#fff;border:none;border-radius:3px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:background .15s;}
.btn-add:hover{background:var(--gold-l);}
.add-macro-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;background:#F7F5F0;border:.5px dashed var(--bd);border-radius:6px;cursor:pointer;margin-bottom:18px;color:var(--ch-m);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;width:100%;transition:background .15s;}
.add-macro-btn:hover{background:var(--gold-p);border-color:var(--gold);}
.tot-box{background:var(--ch);border-radius:6px;padding:20px 24px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;}
.tr{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:.5px solid rgba(255,255,255,.08);}
.tr:last-child{border-bottom:none;}
.tl{font-size:10px;font-weight:400;color:#AAA;letter-spacing:.08em;text-transform:uppercase;}
.tv{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;color:#fff;}
.tgl{font-size:11px;font-weight:500;color:#AAA;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.tgv{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--gold-l);}
.actions{display:flex;gap:10px;justify-content:flex-end;padding:0 28px 0;}
.btn-sec{font-family:'Jost',sans-serif;font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--ch-m);border:.5px solid var(--bd);border-radius:4px;padding:10px 22px;cursor:pointer;transition:all .15s;}
.btn-sec:hover{border-color:var(--ch-m);color:var(--ch);}
.btn-pri{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;border:none;border-radius:4px;padding:10px 26px;cursor:pointer;transition:background .15s;}
.btn-pri:hover{background:var(--gold-l);}
.btn-pri:disabled{background:var(--ch-lt);cursor:not-allowed;}
.toast{position:fixed;bottom:28px;right:28px;background:var(--ch);color:#fff;font-size:12px;padding:11px 20px;border-radius:4px;border-left:3px solid var(--gold);opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;font-family:'Jost',sans-serif;}
.toast.show{opacity:1;}
.arch-empty{text-align:center;padding:48px;color:var(--ch-lt);font-size:13px;font-weight:300;}
.arch-card{background:#fff;border:.5px solid var(--bd);border-radius:6px;padding:16px 20px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;}
.arch-card:hover{border-color:var(--gold);}
.arch-num{font-size:12px;font-weight:500;color:var(--ch);}
.arch-cliente{font-size:12px;color:var(--ch-m);margin-top:3px;}
.arch-data{font-size:10px;color:var(--ch-lt);margin-top:2px;}
.arch-tot{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold);font-weight:500;margin-bottom:6px;}
.arch-actions{display:flex;gap:6px;justify-content:flex-end;}
.arch-btn{font-size:10px;padding:4px 12px;border:.5px solid var(--bd);border-radius:3px;cursor:pointer;background:none;color:var(--ch-m);font-family:'Jost',sans-serif;letter-spacing:.05em;transition:all .15s;}
.arch-btn:hover{background:var(--sf);border-color:var(--ch-lt);}
.arch-btn.del{color:#c0392b;border-color:#f5c6c6;}
.arch-btn.del:hover{background:#fdf0f0;}
.badge-boz{font-size:9px;background:#FEF3E2;color:#A0620A;padding:2px 8px;border-radius:2px;font-weight:500;letter-spacing:.04em;}
@media(max-width:600px){
  .g2,.g3{grid-template-columns:1fr;}
  .topbar{padding:12px 16px;}
  .view{padding:18px 16px 0;}
  .actions{padding:0 16px;}
  .tot-box{grid-template-columns:1fr;gap:12px;}
  .tgv{font-size:24px;}
}
</style>
</head>

function goTo(v, btn) {
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  btn.classList.add('on');
  if(v==='arch') renderArchivio();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

function addMacro(nome='', voci=[], open=true) {
  const id = macroId++;
  macros.push({id, nome: nome||'Nuova macroarea', voci: voci||[], open});
  renderMacros();
}

function removeMacro(id) {
  if(!confirm('Eliminare questa macroarea?')) return;
  macros = macros.filter(m=>m.id!==id);
  renderMacros();
}

function toggleMacro(id) {
  const m = macros.find(m=>m.id===id);
  if(m){m.open=!m.open; renderMacros();}
}

function addVoce(macroId) {
  const m = macros.find(m=>m.id===macroId);
  if(!m) return;
  const inp = document.getElementById('new-desc-'+macroId);
  const desc = inp ? inp.value.trim() : '';
  m.voci.push({desc:desc||'Nuova voce', um:'mq', qty:1, pu:0, sc:0, iva:10});
  if(inp) inp.value='';
  renderMacros(); ricalcola();
}

function removeVoce(mid, vi) {
  const m = macros.find(m=>m.id===mid);
  if(m){m.voci.splice(vi,1); renderMacros(); ricalcola();}
}

function updateVoce(mid, vi, field, val) {
  const m = macros.find(m=>m.id===mid);
  if(!m) return;
  if(['qty','pu','sc','iva'].includes(field)) val=parseFloat(val)||0;
  m.voci[vi][field]=val;
  ricalcola();
  const ti = document.getElementById('tot-'+mid+'-'+vi);
  if(ti){const v=m.voci[vi];ti.textContent=fmt(v.qty*v.pu*(1-v.sc/100));}
  const mt = document.getElementById('m-tot-'+mid);
  if(mt){mt.textContent=fmt(m.voci.reduce((s,v)=>s+v.qty*v.pu*(1-v.sc/100),0));}
}

function updateMacroName(id, val) {
  const m = macros.find(m=>m.id===id);
  if(m) m.nome=val;
}

function renderMacros() {
  const el = document.getElementById('macro-list');
  el.innerHTML='';
  macros.forEach((m,mi)=>{
    const mt = m.voci.reduce((s,v)=>s+v.qty*v.pu*(1-v.sc/100),0);
    const voceRows = m.voci.map((v,vi)=>{
      const imp=v.qty*v.pu*(1-v.sc/100);
      return `<tr>
        <td><input value="${(v.desc||'').replace(/"/g,'&quot;')}" onchange="updateVoce(${m.id},${vi},'desc',this.value)"/></td>
        <td><input value="${v.um||''}" onchange="updateVoce(${m.id},${vi},'um',this.value)" style="width:50px;text-align:center;"/></td>
        <td><input type="number" value="${v.qty}" step="0.1" min="0" onchange="updateVoce(${m.id},${vi},'qty',this.value)" style="width:55px;text-align:right;"/></td>
        <td><input type="number" value="${v.pu}" step="0.01" min="0" onchange="updateVoce(${m.id},${vi},'pu',this.value)" style="width:75px;text-align:right;"/></td>
        <td><input type="number" value="${v.sc}" step="1" min="0" max="100" onchange="updateVoce(${m.id},${vi},'sc',this.value)" style="width:42px;text-align:right;"/></td>
        <td class="tot-cell" id="tot-${m.id}-${vi}">${fmt(imp)}</td>
        <td><select onchange="updateVoce(${m.id},${vi},'iva',this.value)" style="font-size:10px;padding:2px 4px;border:.5px solid #E0D8CC;border-radius:2px;background:#F5EDD8;color:#B8873A;">
          <option ${v.iva==4?'selected':''} value="4">4%</option>
          <option ${v.iva==10?'selected':''} value="10">10%</option>
          <option ${v.iva==22?'selected':''} value="22">22%</option>
          <option ${v.iva==0?'selected':''} value="0">ES.</option>
        </select></td>
        <td style="text-align:center;"><button class="del-voce" onclick="removeVoce(${m.id},${vi})">✕</button></td>
      </tr>`;
    }).join('');
    const div = document.createElement('div');
    div.className='macro';
    div.innerHTML=`
      <div class="mh" onclick="toggleMacro(${m.id})">
        <div class="mh-left">
          <span class="m-num">${String(mi+1).padStart(2,'0')}</span>
          <input class="m-name-inp" value="${(m.nome||'').replace(/"/g,'&quot;')}" onclick="event.stopPropagation()" onchange="updateMacroName(${m.id},this.value)" />
        </div>
        <div class="mh-right">
          <span class="m-tot" id="m-tot-${m.id}">${fmt(mt)}</span>
          <button class="m-del" onclick="event.stopPropagation();removeMacro(${m.id})">Elimina</button>
          <span class="m-toggle ${m.open?'open':''}">▾</span>
        </div>
      </div>
      <div class="mb ${m.open?'open':''}">
        <table class="vt">
          <colgroup>
            <col style="width:34%"><col style="width:7%"><col style="width:9%"><col style="width:11%"><col style="width:6%"><col style="width:13%"><col style="width:10%"><col style="width:5%">
          </colgroup>
          <thead><tr>
            <th>Descrizione</th><th>U.M.</th><th>Qtà</th><th>Prezzo unit.</th><th>Sc.%</th><th>Totale</th><th>IVA</th><th></th>
          </tr></thead>
          <tbody>${voceRows}</tbody>
        </table>
        <div class="add-row">
          <input id="new-desc-${m.id}" placeholder="Descrizione nuova voce..." onkeydown="if(event.key==='Enter')addVoce(${m.id})"/>
          <button class="btn-add" onclick="addVoce(${m.id})">+ Aggiungi voce</button>
        </div>
      </div>`;
    el.appendChild(div);
  });
  ricalcola();
}

function ricalcola() {
  let imp=0,sc=0,iva10=0,iva22=0,iva4=0;
  macros.forEach(m=>m.voci.forEach(v=>{
    const lordo=v.qty*v.pu, sco=lordo*v.sc/100, net=lordo-sco;
    imp+=net; sc+=sco;
    if(v.iva==10)iva10+=net*0.10;
    else if(v.iva==22)iva22+=net*0.22;
    else if(v.iva==4)iva4+=net*0.04;
  }));
  document.getElementById('r-imp').textContent=fmt(imp);
  document.getElementById('r-sc').textContent='— '+fmt(sc);
  document.getElementById('r-10').textContent=fmt(iva10);
  document.getElementById('r-22').textContent=fmt(iva22);
  document.getElementById('r-tot').textContent=fmt(imp+iva10+iva22+iva4);
}

    else if(v.iva==4)iva4+=net*0.04;
  }));
  const tot=imp+iva10+iva22+iva4;
  const bozze=getBozze();
  bozze.push({id:'bozza_'+Date.now(),num,cliente,tot,data:new Date().toLocaleDateString('it-IT'),payload:d});
  setBozze(bozze);
  showToast('Bozza "'+num+'" salvata');
}

function renderArchivio() {
  const el=document.getElementById('arch-list');
  const bozze=getBozze();
  if(!bozze.length){el.innerHTML='<div class="arch-empty">Nessuna bozza salvata.<br>Crea un preventivo e clicca "Salva bozza".</div>';return;}
  el.innerHTML='';
  [...bozze].reverse().forEach(item=>{
    const div=document.createElement('div');
    div.className='arch-card';
    div.innerHTML=`
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
          <span class="arch-num">${item.num}</span>
          <span class="badge-boz">Bozza</span>
        </div>
        <div class="arch-cliente">${item.cliente}</div>
        <div class="arch-data">${item.data}</div>
      </div>
      <div style="text-align:right;">
        <div class="arch-tot">${fmt(item.tot)}</div>
        <div class="arch-actions">
          <button class="arch-btn" onclick="apriPreventivo('${item.id}')">Apri</button>
          <button class="arch-btn del" onclick="eliminaBozza('${item.id}')">Elimina</button>
        </div>
      </div>`;
    el.appendChild(div);
  });
}

function apriPreventivo(id) {
  const item=getBozze().find(b=>b.id===id);
  if(!item) return;
  caricaDati(item.payload);
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  document.getElementById('v-prev').classList.add('on');
  document.querySelectorAll('.nb')[0].classList.add('on');
  showToast('Preventivo "'+item.num+'" aperto');
}

function eliminaBozza(id) {
  if(!confirm('Eliminare questa bozza?')) return;
  setBozze(getBozze().filter(b=>b.id!==id));
  showToast('Bozza eliminata');
  renderArchivio();
}

function nuovoPreventivo() {
  if(!confirm('Iniziare un nuovo preventivo? I dati non salvati andranno persi.')) return;
  macros=[]; macroId=0;
  document.querySelectorAll('#v-prev input:not([type=button]),#v-prev textarea').forEach(e=>e.value='');
  document.getElementById('iv-val').value='60 giorni';
  document.getElementById('iv-tipo').value='Ristrutturazione ordinaria';
  
document.getElementById('iv-data').value=new Date().toISOString().split('T')[0];
  document.getElementById('iv-num').value='GL-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900)+100).padStart(3,'0');
  document.getElementById('note').value='Pagamento: 50% alla firma del contratto, 50% al completamento dei lavori. I prezzi si intendono IVA esclusa. Validita\' offerta: 60 giorni dalla data di emissione. Gruppo Leonardo S.r.l. e\' in possesso di regolare assicurazione RC professionale.';
  const DEF=[
    {nome:'Studio tecnico e accantieramento',voci:[]},
    {nome:'Demolizioni e smantellamenti',voci:[]},
    {nome:'Costruzioni e opere murarie',voci:[]},
    {nome:'Infissi e serramenti',voci:[]},
    {nome:'Smaltimento rifiuti e pratiche',voci:[]},
  ];
  DEF.forEach(m=>addMacro(m.nome,m.voci));
  showToast('Nuovo preventivo pronto');
}

/* ══════════════════════════════════════════════════════
   GENERA PDF — Layout C con jsPDF
══════════════════════════════════════════════════════ */
function generaPDF() {
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;
  btn.textContent = 'Generazione...';

  setTimeout(() => {
    try {
      _buildPDF();
    } catch(e) {
      console.error(e);
      showToast('Errore generazione PDF');
    }
    btn.disabled = false;
    btn.textContent = 'Genera PDF';
  }, 50);
}

function _buildPDF() {
  const d = raccogliDati();
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const PW = 210, PH = 297, MG = 18, UW = PW - 2*MG;

  const setRGB = (c) => doc.setTextColor(c[0],c[1],c[2]);
  const setFill = (c) => doc.setFillColor(c[0],c[1],c[2]);
  const setDraw = (c) => doc.setDrawColor(c[0],c[1],c[2]);
  const eur = v => '€ ' + Number(v).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});

  let y = 8; // cursore verticale

  /* ── LOGO centrato ─────────────────────────────────────────────── */
  try {
    const logoH = 20, logoW = logoH * 2.09;
    const lx = (PW - logoW) / 2;
    doc.addImage('data:image/png;base64,'+LOGO_B64, 'PNG', lx, y, logoW, logoH, '', 'FAST');
    y += logoH + 3;
  } catch(e) { y += 5; }

  /* ── Divisore oro ─────────────────────────────────────────────── */
  setFill(GOLD);
  doc.rect((PW-50)/2, y, 50, 0.6, 'F');
  y += 4;

  /* ── Striscia scura dati azienda — larghezza piena pagina ──────── */
  const stripH = 16;
  setFill(CH);
  doc.rect(0, y, PW, stripH, 'F');

  const azItems = [
    'P.IVA '+AZIENDA.piva,
    'Tel. '+AZIENDA.tel,
    AZIENDA.email,
    'PEC: '+AZIENDA.pec,
    AZIENDA.sito
  ];
  const colW = PW / azItems.length;
  doc.setFont('helvetica','normal');
  doc.setFontSize(6.5);
  setRGB([187,187,187]);
  azItems.forEach((item,i) => {
    doc.text(item, colW*i + colW/2, y + stripH - 8, {align:'center'});
  });
  // Separatori
  setDraw([85,85,85]);
  doc.setLineWidth(0.2);
  for(let i=1;i<azItems.length;i++) doc.line(colW*i, y+2, colW*i, y+stripH-2);
  // Sedi
  doc.setFontSize(5.5);
  setRGB([119,119,119]);
  const sedi = 'Sede legale: '+AZIENDA.sedeLegale+'   |   Sede operativa: '+AZIENDA.sedeOp;
  doc.text(sedi, PW/2, y + stripH - 2, {align:'center'});
  y += stripH + 1.5;

  /* ── Barra dati documento — larghezza piena pagina ─────────────── */
  const barH = 14;
  setFill(SURFACE);
  doc.rect(0, y, PW, barH, 'F');
  setDraw(BORDER);
  doc.setLineWidth(0.3);
  doc.rect(0, y, PW, barH, 'S');

  // Formatta data leggibile
  const dataRaw = d.intervento.data;
  let dataFmt = dataRaw;
  if(dataRaw) {
    const dt = new Date(dataRaw);
    dataFmt = dt.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
  }

  const docItems = [
    {lbl:'NUMERO PREVENTIVO', val:d.intervento.numero||'—', gold:true},
    {lbl:'DATA EMISSIONE',    val:dataFmt||'—',              gold:false},
    {lbl:"VALIDITA'",         val:d.intervento.validita,     gold:false},
    {lbl:'TIPOLOGIA',         val:d.intervento.tipo,         gold:false},
  ];
  const colW2 = PW / docItems.length;
  docItems.forEach((item,i) => {
    const cx = colW2*i + colW2/2;
    // Label
    doc.setFont('helvetica','normal');
    doc.setFontSize(5.5);
    setRGB(CH_LT);
    doc.text(item.lbl, cx, y+4.5, {align:'center'});
    // Valore
    if(item.gold){
      doc.setFont('helvetica','bold');
      doc.setFontSize(12);
      setRGB(GOLD);
    } else {
      doc.setFont('helvetica','normal');
      doc.setFontSize(8.5);
      setRGB(CH);
    }
    doc.text(item.val, cx, y+barH-3, {align:'center'});
    // Separatori
    if(i>0){
      setDraw(BORDER);
      doc.setLineWidth(0.3);
      doc.line(colW2*i, y+2, colW2*i, y+barH-2);
    }
  });
  y += barH + 5;

  /* ── Anagrafica ─────────────────────────────────────────────────── */
  const half = UW / 2;
  const anagH = 28;
  const anagY = y;

  // Cella sinistra
  setFill(WHITE);
  doc.rect(MG, anagY, half, anagH, 'F');
  setDraw(BORDER);
  doc.setLineWidth(0.3);
  doc.rect(MG, anagY, half, anagH, 'S');

  // Cella destra
  doc.rect(MG+half, anagY, half, anagH, 'F');
  doc.rect(MG+half, anagY, half, anagH, 'S');

  // Contenuto sinistra
  doc.setFont('helvetica','bold');
  doc.setFontSize(6.5);
  setRGB(GOLD);
  doc.text('COMMITTENTE', MG+4, anagY+5);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  setRGB(CH);
  doc.text(d.cliente.nome||'—', MG+4, anagY+11);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  setRGB(CH_M);
  const clLines = [d.cliente.indirizzo, d.cliente.tel, d.cliente.email].filter(Boolean);
  clLines.forEach((l,i) => doc.text(l, MG+4, anagY+16+i*4.5));

  // Contenuto destra
  const rx = MG+half+4;
  doc.setFont('helvetica','bold');
  doc.setFontSize(6.5);
  setRGB(GOLD);
  doc.text('FABBRICATO OGGETTO DI INTERVENTO', rx, anagY+5);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  setRGB(CH);
  doc.text(d.intervento.tipo||'—', rx, anagY+11);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  setRGB(CH_M);
  const ivLines = [d.intervento.indirizzo, 'C.F./P.IVA: '+(d.cliente.cf||'—')].filter(Boolean);
  ivLines.forEach((l,i) => doc.text(l, rx, anagY+16+i*4.5));

  y += anagH + 5;

  /* ── Sezione label ──────────────────────────────────────────────── */
  doc.setFont('helvetica','bold');
  doc.setFontSize(7);
  setRGB(CH);
  doc.text('— VOCI DI CAPITOLATO —', PW/2, y, {align:'center'});
  y += 5;

  /* ── Macroaree ──────────────────────────────────────────────────── */
  const colsW = [UW*0.36, UW*0.07, UW*0.07, UW*0.12, UW*0.06, UW*0.13, UW*0.08, UW*0.11];
  const colsX = colsW.reduce((acc,w,i) => { acc.push(i===0?MG:(acc[i-1]+colsW[i-1])); return acc; }, []);

  macros.forEach((macro, mi) => {
    const macroTot = macro.voci.reduce((s,v)=>s+v.qty*v.pu*(1-v.sc/100),0);
    const rowsNeeded = macro.voci.length;
    const estimatedH = 8 + 7 + rowsNeeded * 8;

    // Controlla salto pagina
    if(y + estimatedH > PH - 25) {
      doc.addPage();
      y = 15;
    }

    // Header macroarea
    setFill(LIGHT_BG);
    doc.rect(MG, y, UW, 8, 'F');
    setFill(GOLD);
    doc.rect(MG, y+8, UW, 0.5, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(7.5);
    setRGB(CH_M);
    doc.text(`${macro.num||String(mi+1).padStart(2,'0')}  —  ${macro.nome.toUpperCase()}`, MG+4, y+5.5);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    setRGB(GOLD_L);
    doc.text(eur(macroTot), MG+UW-4, y+5.5, {align:'right'});
    y += 8.5;

    // Header colonne
    setFill(CH);
    doc.rect(MG, y, UW, 7, 'F');
    const thLabels = ['DESCRIZIONE','U.M.',"QTA'",'P.UNIT.','SC%','TOTALE','IVA%','IVA €'];
    thLabels.forEach((lbl,i) => {
      doc.setFont('helvetica','bold');
      doc.setFontSize(6);
      setRGB(WHITE);
      doc.text(lbl, colsX[i]+2, y+5, {});
    });
    y += 7;

    // Voci
    macro.voci.forEach((v, vi) => {
      if(y > PH - 25){ doc.addPage(); y=15; }
      const imp = v.qty*v.pu*(1-v.sc/100);
      const ivaV = imp * v.iva/100;
      const rowH = 8;
      const bg = vi%2===0 ? WHITE : [252,251,249];
      setFill(bg);
      doc.rect(MG, y, UW, rowH, 'F');

      doc.setFont('helvetica','normal');
      doc.setFontSize(7.5);
      setRGB(CH);

      const vals = [
        v.desc, v.um, String(v.qty),
        eur(v.pu), v.sc?v.sc+'%':'—',
        eur(imp), v.iva+'%', eur(ivaV)
      ];
      vals.forEach((val,i) => {
        const rightAlign = i>=2;
        const isGold = i===5;
        if(isGold){ doc.setFont('helvetica','bold'); setRGB(GOLD); }
        else { doc.setFont('helvetica','normal'); setRGB(CH); }
        const maxW = colsW[i]-4;
        const tx = rightAlign ? colsX[i]+colsW[i]-2 : colsX[i]+2;
        // Tronca testo lungo per colonna descrizione
        let txt = val;
        if(i===0 && doc.getTextWidth(txt) > maxW) {
          while(doc.getTextWidth(txt+'...') > maxW && txt.length > 0) txt=txt.slice(0,-1);
          txt += '...';
        }
        doc.text(txt, tx, y+5.5, rightAlign?{align:'right'}:{});
      });

      setDraw([240,236,228]);
      doc.setLineWidth(0.2);
      doc.line(MG, y+rowH, MG+UW, y+rowH);
      y += rowH;
    });

    // Bordo macroarea
    setDraw(BORDER);
    doc.setLineWidth(0.3);
    doc.rect(MG, y-macro.voci.length*8-8-7, UW, macro.voci.length*8+8+7, 'S');
    y += 4;
  });

  y += 3;

  /* ── Riepilogo ──────────────────────────────────────────────────── */
  if(y > PH - 60){ doc.addPage(); y=15; }
  doc.setFont('helvetica','bold');
  doc.setFontSize(7);
  setRGB(CH);
  doc.text('— RIEPILOGO ECONOMICO —', PW/2, y, {align:'center'});
  y += 5;

  // Calcola totali
  let totImp=0,totSc=0,totIva10=0,totIva22=0,totIva4=0;
  macros.forEach(m=>m.voci.forEach(v=>{
    const lordo=v.qty*v.pu, sco=lordo*v.sc/100, net=lordo-sco;
    totImp+=net; totSc+=sco;
    if(v.iva==10)totIva10+=net*0.10;
    else if(v.iva==22)totIva22+=net*0.22;
    else if(v.iva==4)totIva4+=net*0.04;
  }));
  const totFinale = totImp+totIva10+totIva22+totIva4;

  const totH = 32;
  const leftW = UW*0.55 - 3;
  const rightX = MG+UW*0.55+3;
  const rightW = UW*0.45 - 3;

  // Pannello sx
  setFill(SURFACE);
  doc.rect(MG, y, leftW, totH, 'F');
  setDraw(BORDER);
  doc.setLineWidth(0.3);
  doc.rect(MG, y, leftW, totH, 'S');

  const totRows=[
    ['Imponibile totale', eur(totImp)],
    ['Sconti applicati', totSc?'- '+eur(totSc):'—'],
    ['IVA 10%', eur(totIva10)],
    ['IVA 22%', eur(totIva22)],
  ];
  totRows.forEach(([lbl,val],i)=>{
    const ry = y+6+i*6;
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    setRGB(CH_LT);
    doc.text(lbl, MG+4, ry);
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    setRGB(CH);
    doc.text(val, MG+leftW-4, ry, {align:'right'});
    if(i<totRows.length-1){
      setDraw([224,216,204]);
      doc.setLineWidth(0.2);
      doc.line(MG+3, ry+1.5, MG+leftW-3, ry+1.5);
    }
  });

  // Pannello dx
  setFill(GOLD_P);
  doc.rect(rightX, y, rightW, totH, 'F');
  setDraw(GOLD);
  doc.setLineWidth(0.8);
  doc.rect(rightX, y, rightW, totH, 'S');
  const cx2 = rightX + rightW/2;
  doc.setFont('helvetica','bold');
  doc.setFontSize(7);
  setRGB(CH_M);
  doc.text('TOTALE PREVENTIVO', cx2, y+7, {align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(6);
  setRGB(CH_LT);
  doc.text('(IVA INCLUSA)', cx2, y+11.5, {align:'center'});
  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  setRGB(GOLD);
  doc.text(eur(totFinale), cx2, y+24, {align:'center'});

  y += totH + 5;

  /* ── Note ───────────────────────────────────────────────────────── */
  if(y > PH - 40){ doc.addPage(); y=15; }
  doc.setFont('helvetica','bold');
  doc.setFontSize(7);
  setRGB(GOLD);
  doc.text('NOTE E CONDIZIONI DI PAGAMENTO', MG, y);
  y += 3;

  const noteText = d.note || '';
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  const noteLines = doc.splitTextToSize(noteText, UW-16);
  const noteH = noteLines.length*4.5 + 8;
  setFill(GOLD_P);
  doc.rect(MG, y, UW, noteH, 'F');
  setFill(GOLD);
  doc.rect(MG, y, 2, noteH, 'F');
  setRGB(CH_M);
  doc.text(noteLines, MG+7, y+6);
  y += noteH + 5;

  /* ── Firma ───────────────────────────────────────────────────────── */
  if(y > PH - 35){ doc.addPage(); y=15; }
  const firmaH = 30;
  setFill(WHITE);
  doc.rect(MG, y, UW, firmaH, 'F');
  setDraw(BORDER);
  doc.setLineWidth(0.3);
  doc.rect(MG, y, UW, firmaH, 'S');
  doc.line(MG+UW*0.44, y, MG+UW*0.44, y+firmaH);
  doc.line(MG+UW*0.72, y, MG+UW*0.72, y+firmaH);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  setRGB(CH_M);
  const accText = doc.splitTextToSize('Il Cliente dichiara di accettare il presente preventivo nelle condizioni economiche e tecniche sopra indicate.', UW*0.4);
  doc.text(accText, MG+4, y+6);
  doc.text('Per Gruppo Leonardo S.r.l.', MG+UW*0.44+4, y+6);
  doc.text('_______________________', MG+UW*0.44+4, y+22);
  doc.text('Firma e timbro', MG+UW*0.44+4, y+27);
  doc.text('Il Cliente', MG+UW*0.72+4, y+6);
  doc.text('_______________________', MG+UW*0.72+4, y+22);
  doc.text('Firma', MG+UW*0.72+4, y+27);

  y += firmaH + 5;

  /* ── Footer ──────────────────────────────────────────────────────── */
  const totalPages = doc.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);
    setDraw(BORDER);
    doc.setLineWidth(0.3);
    doc.line(MG, PH-16, PW-MG, PH-16);
    doc.setFont('helvetica','normal');
    doc.setFontSize(6);
    setRGB(CH_LT);
    const ftxt = `${AZIENDA.nome}  ·  P.IVA ${AZIENDA.piva}  ·  Sede legale: ${AZIENDA.sedeLegale}  ·  ${AZIENDA.email}  ·  PEC: ${AZIENDA.pec}`;
    doc.text(ftxt, PW/2, PH-12, {align:'center'});
    doc.text('Pag. '+p+'/'+totalPages, PW-MG, PH-12, {align:'right'});
  }

  /* ── Salva ───────────────────────────────────────────────────────── */
  const num = d.intervento.numero || 'preventivo';
  const cliente = (d.cliente.nome||'cliente').replace(/\s+/g,'_');
  doc.save(`${num}_${cliente}.pdf`);
  showToast('PDF generato e scaricato!');
}
